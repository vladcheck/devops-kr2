services:
  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: kr2-app:1.0
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STUDENT=Валекжанин
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:

networks:
  backend:
